name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  test:
    name: pytest (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Current stable, and dev/RC — the concrete mitigation for
        # helper_integration API churn risk #22 in the accepted design.
        # dev's minimum Python requirement moves independently of stable's
        # (observed directly in this spike's own CI: dev required >=3.14.2
        # while 3.13 satisfies stable), so each leg pins its own interpreter
        # rather than sharing one.
        include:
          - ha-version: stable
            python-version: "3.13"
          - ha-version: dev
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.ha-version }}" = "dev" ]; then
            pip install "homeassistant @ git+https://github.com/home-assistant/core.git@dev"
          else
            pip install homeassistant
          fi
          pip install -r requirements_test.txt
      - name: Run tests
        run: pytest -q
